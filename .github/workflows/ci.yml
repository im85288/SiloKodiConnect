name: CI
on:
- pull_request
- push
jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Kodi 21.
        python-version: ['3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Lint
      run: python -m pyflakes resources tests default.py service.py context_dismiss.py
    - name: Test
      run: python -m pytest -q tests
  tests-kodi20:
    # Kodi 20 on Android runs Python 3.8, which the runners' setup-python no
    # longer offers on current Ubuntu: the official image has it.
    name: Tests on Python 3.8
    runs-on: ubuntu-latest
    container: python:3.8-slim
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Lint
      run: python -m pyflakes resources tests default.py service.py context_dismiss.py
    - name: Test
      run: python -m pytest -q tests
