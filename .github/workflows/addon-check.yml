name: Kodi
on:
- pull_request
- push
jobs:
  addon-checker:
    name: Add-on checker (${{ matrix.kodi-branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kodi-branch: [nexus, omega]
    steps:
    # The checker wants the folder named after the add-on id.
    - uses: actions/checkout@v4
      with:
        path: plugin.video.silokodiconnect
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install kodi-addon-checker
      run: pip install kodi-addon-checker
    - name: Remove files not shipped in the add-on
      run: awk '/export-ignore/ { print $1 }' .gitattributes | xargs rm -rf --
      working-directory: plugin.video.silokodiconnect
    - name: Run kodi-addon-checker
      run: kodi-addon-checker --branch=${{ matrix.kodi-branch }} plugin.video.silokodiconnect/
